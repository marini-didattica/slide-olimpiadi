name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Setup @antfu/ni
        run: npm i -g @antfu/ni

      - name: Install dependencies
        run: nci

      - name: Build all decks
        run: |
          entries="$(find src -name '0-main.md' | sort)"
          if [ -z "$entries" ]; then
            echo "No entry points (src/**/0-main.md) found" >&2
            exit 1
          fi
          for entry in $entries; do
            deck="$(basename "$(dirname "$entry")")"
            echo "Building $entry -> /$deck/"
            nr build "$entry" \
              --without-notes \
              --base "/$deck/" \
              --router-mode hash \
              --out "$PWD/dist/$deck"

          done

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=marini-didattica-slide-olimpiadi --branch=main
